<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovelAgent Core Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <aside class="sidebar" id="asset-manager">
            <h2>アセット管理</h2>
            <div class="asset-group">
                <h3>キャラクター</h3>
                <label><input type="checkbox" value="アリス" checked> アリス（主人公）</label>
                <label><input type="checkbox" value="司教"> 司教</label>
            </div>
            <div class="asset-group">
                <h3>世界観・ルール</h3>
                <label><input type="checkbox" value="魔法の等価交換" checked> 魔法の等価交換</label>
                <label><input type="checkbox" value="聖職者階級の規律" checked> 聖職者階級の規律</label>
            </div>
        </aside>

        <main class="main-editor">
            <section class="pipeline-inputs">
                <div class="input-field">
                    <label>全体ゴール</label>
                    <input type="text" id="global-goal" value="アリスが聖都の地下に隠された古代兵器を起動する。">
                </div>
                <div class="input-field">
                    <label>今章の目標</label>
                    <input type="text" id="current-chapter" value="大聖堂の司教の目を盗み、地下書庫への鍵を盗み出す。">
                </div>
                <div class="input-field highlight">
                    <label>直近の肉付け指示（AIへの命令）</label>
                    <textarea id="immediate-instruction" rows="2">司教との会話の中で、アリスが嫌悪感を隠しながらも、あえて恭順な態度を示す描写を行うこと。</textarea>
                </div>
            </section>

            <section class="text-buffer-area">
                <textarea id="current-text" placeholder="ここに生成された本文が蓄積されます...">アリスは呼吸を整え、ゆっくりと司教の方へと歩を進めた。</textarea>
                <div class="actions">
                    <button id="generate-btn">✦ 次の展開を肉付け（生成）</button>
                </div>
            </section>
        </main>

        <aside class="sidebar" id="debug-console">
            <h2>デバッグ・ログ</h2>
            <div id="log-output" class="console-box">
                <p class="system-msg">[SYSTEM] 起動完了。Ollama準備OK。</p>
            </div>
        </aside>
    </div>

    <script src="main.js"></script>
</body>
</html>
